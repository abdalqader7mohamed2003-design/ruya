name: بناء التطبيق ونشر التحديث

on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم الإصدار الجديد (مثال: 1.0.1) - يجب أن يكون أكبر من السابق"
        required: false
        default: "1.0.0"
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "version.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز ملفات المشروع من project.zip (أول مرة فقط)
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm -f project.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "إضافة ملفات المشروع" || true
            git push
          fi

      - name: التحقق من الإعدادات
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ ! -f keystore/ryt.p12.enc ]; then
            echo "::error::ملف المفتاح keystore/ryt.p12.enc غير موجود. ارفع project.zip أولاً"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::السر KEYSTORE_PASSWORD غير مضاف. أضفه من Settings > Secrets and variables > Actions"
            exit 1
          fi
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ] && [ -f version.txt ]; then
            VERSION="$(tr -d ' \r\n' < version.txt)"
            VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::رقم الإصدار غير صالح. اكتب مثلاً 1.0.1"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ضبط رقم الإصدار والمستودع داخل التطبيق
        run: |
          BRANCH="${{ github.ref_name }}"
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#; s#__BRANCH__#${BRANCH}#; s#0.0.0-dev#${VERSION}#" www/config.js
          cat www/config.js

      - name: تثبيت الأدوات
        run: npm install

      - name: إنشاء مشروع أندرويد
        run: npx cap add android

      - name: الأيقونة (إن فشلت يُستخدم الشكل الافتراضي)
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: مزامنة الملفات
        run: npx cap sync android

      - name: رقم النسخة داخل أندرويد
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \".*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: بناء النسخة
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: التوقيع بالمفتاح الثابت
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/ryt.p12.enc \
            -out "$RUNNER_TEMP/ryt.p12" -pass env:KEYSTORE_PASSWORD
          mkdir -p out
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" out/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ryt.p12" --ks-type pkcs12 \
            --ks-key-alias ryt --ks-pass env:KEYSTORE_PASSWORD \
            --out out/ruya-fi-altareekh.apk out/aligned.apk
          "$BT/apksigner" verify --print-certs out/ruya-fi-altareekh.apk
          rm -f "$RUNNER_TEMP/ryt.p12"

      - name: نشر الإصدار
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" out/ruya-fi-altareekh.apk \
            --title "الإصدار ${VERSION}" \
            --notes "تحديث تطبيق رؤيا في التاريخ"
